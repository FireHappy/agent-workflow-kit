<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页闹钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <header class="site-header">
      <h1>⏰ 网页闹钟</h1>
      <p class="subtitle">纯前端单页应用 · 数据保存在本地浏览器（localStorage）</p>
    </header>

    <!-- 时钟与倒计时 -->
    <section class="card clock-card" id="clockCard">
      <div class="clock-label">当前时间</div>
      <div class="clock-display" id="clockDisplay">--:--:--</div>
      <div class="clock-sub" id="clockSub">&nbsp;</div>

      <div class="next-block">
        <span class="next-label">🔉 下一个闹钟倒计时</span>
        <span class="next-countdown" id="countdown">--:--:--</span>
        <span class="next-detail" id="countdownDetail">未设置启用的闹钟</span>
      </div>

      <button type="button" class="btn btn-ghost" id="testRingBtn">🔔 测试响铃 3 秒</button>
      <p class="hint">首次发声需先在页面内点击一次（浏览器自动播放策略）；到点后弹窗 + 页面闪烁 + 蜂鸣音，闹钟响铃后自动停用。</p>
    </section>

    <!-- 设置闹钟 -->
    <section class="card">
      <h2>设置闹钟</h2>
      <form id="alarmForm" class="alarm-form" novalidate>
        <div class="time-fields">
          <label class="field">
            <span>小时</span>
            <input type="number" id="hourInput" min="0" max="23" step="1" value="8" required>
          </label>
          <span class="colon">:</span>
          <label class="field">
            <span>分钟</span>
            <input type="number" id="minuteInput" min="0" max="59" step="1" value="0" required>
          </label>
        </div>
        <label class="field note-field">
          <span>标签（可选）</span>
          <input type="text" id="labelInput" maxlength="30" placeholder="例如：起床啦 / 开会提醒">
        </label>
        <button type="submit" class="btn btn-primary">＋ 添加闹钟</button>
        <p class="form-error" id="formError" hidden></p>
      </form>
    </section>

    <!-- 闹钟列表 -->
    <section class="card">
      <h2>闹钟列表 <span class="count-badge" id="alarmCount">0</span></h2>
      <ul class="alarm-list" id="alarmList"></ul>
      <p class="empty-hint" id="emptyHint">还没有闹钟，先在上方添加一个吧～</p>
    </section>

    <footer class="site-footer">网页闹钟 · 纯前端 · 无外部依赖</footer>

  </main>

  <!-- 到点提醒弹窗 -->
  <div class="modal-overlay" id="ringModal" hidden>
    <div class="modal" role="alertdialog" aria-labelledby="ringTitle" aria-modal="true">
      <div class="modal-icon">⏰</div>
      <h2 id="ringTitle">闹钟时间到！</h2>
      <ul class="ring-list" id="ringList"></ul>
      <button type="button" class="btn btn-primary btn-large" id="stopRingBtn">停止响铃</button>
      <p class="hint">响铃后该闹钟将自动停用，可在列表中重新启用</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
